[pytest]
# Only collect unit tests from the dedicated directory. The `tests/`
# folder holds the framework's *validation* tests (run by main.py),
# not pytest cases — separating them prevents accidental collection.
testpaths = tests_unit
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --strict-markers
filterwarnings =
    error
